name: Build OpenList AAR only

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-aar:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go 1.24.1
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.1'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build alistlib.aar via gomobile
        working-directory: AListLib/scripts
        run: |
          set -e
          sh install_alist.sh
          sh install_gomobile.sh
          sh build_aar.sh
          ls -lh ../../app/libs/

      - name: Upload AAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: alistlib-aar
          path: app/libs/*.aar
          if-no-files-found: error
          retention-days: 30
