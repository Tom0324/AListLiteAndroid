name: Build OpenList AAR only

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-aar:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go 1.25
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Pin OpenList to known-good v4.2.6
        working-directory: AListLib/scripts
        run: |
          set -e
          python3 - <<'PY'
          p = 'install_alist.sh'
          s = open(p, encoding='utf-8').read()
          # backend: pin latest -> v4.2.6
          s = s.replace(
              'TAG_NAME=$(curl -s -k https://api.github.com/repos/OpenListTeam/OpenList/releases/latest | grep -o \'"tag_name": ".*"\' | cut -d\'"\' -f4)',
              'TAG_NAME=v4.2.6')
          # frontend: pin releases/latest/download/<file> -> releases/download/<tag>/<file>
          s = s.replace(
              'OpenList-Frontend/releases/latest/download/openlist-frontend-dist-${TAG_NAME}.tar.gz',
              'OpenList-Frontend/releases/download/${TAG_NAME}/openlist-frontend-dist-${TAG_NAME}.tar.gz')
          open(p, 'w', encoding='utf-8').write(s)
          print([l for l in s.splitlines() if 'TAG_NAME=' in l or 'openlist-frontend-dist' in l])
          PY

      - name: Build alistlib.aar via gomobile
        working-directory: AListLib/scripts
        run: |
          set -e
          sh install_alist.sh
          sh install_gomobile.sh
          sh build_aar.sh
          ls -lh ../../app/libs/

      - name: Upload AAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: alistlib-aar
          path: app/libs/*.aar
          if-no-files-found: error
          retention-days: 30
